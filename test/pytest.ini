[pytest]
testpaths = tests
addopts = -p no:junitxml
markers =
    smoke: Smoke test for critical paths
    auth: Auth service API tests
    wechat: WeChat mini-program related tests
    admin: Admin-related tests
    knowledge: Knowledge service CRUD tests
    webapp: Web app E2E tests (Playwright)
    ai_workbench: AI workbench tests (cards/questions/review/sensitive-words)
    content: Content management tests (domains/chapters/cards/questions)
    operations: Operations config tests (points/unlock/banner/badges/ads/review)
    dashboard: Dashboard and system tests (analytics/users/logs)
